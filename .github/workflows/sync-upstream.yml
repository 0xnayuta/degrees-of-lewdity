# 定时同步上游 gitgud.io/Vrelnir/degrees-of-lewdity
# 设计要点：
# 1. schedule 触发器要求本文件位于默认分支 master（因此 master 含一个上游没有的 .github 提交，
#    上游推进后无法快进 —— 策略为"能快进则快进，否则自动合并，绝不 force"）
# 2. 仅当上游有更新时才 push（master/dev 均先比较哈希）
# 3. 同步后跑 sanityCheck.sh：该脚本无失败退出码、且上游树本身带数百条既有告警，
#    因此做成"门禁"——只把【本次同步实际改动文件】里出现的【结构性破坏类】发现当作失败，
#    其余类别仅记录到日志
# 4. 不删除任何分支、不反向推送、不动本地主题分支
name: Sync upstream

on:
  schedule:
    # 每 6 小时（UTC）；上游发布节奏为数天一次，冗余足够
    - cron: "0 */6 * * *"
  workflow_dispatch: {} # 手动触发

permissions:
  contents: write

# 防止定时与手动运行重叠
concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: master

      - name: Fetch upstream
        run: |
          git remote add upstream https://gitgud.io/Vrelnir/degrees-of-lewdity.git
          git fetch --prune origin
          git fetch --prune upstream

      - name: Sync master (merge → sanityCheck 门禁 → push)
        run: |
          set -uo pipefail

          if [ "$(git rev-parse HEAD)" = "$(git rev-parse upstream/master)" ]; then
            echo "master: already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          before=$(git rev-parse HEAD)
          git merge --no-edit upstream/master
          after=$(git rev-parse HEAD)
          if [ "$before" = "$after" ]; then
            echo "master: already up to date"
            exit 0
          fi

          # ---- sanityCheck.sh 门禁（仅检查本次同步实际改动的文件）----
          # 脚本特性：无失败退出码、输出含 ANSI 色码、上游树本身有大量既有告警，
          # 故先剥色码，再按 changed-files 过滤，只把结构性破坏类发现当作失败。
          echo "== Running sanityCheck.sh (changed files only) =="
          out="$(echo | ./sanityCheck.sh 2>&1 | sed 's/\x1b\[[0-9;]*m//g' || true)"

          # 结构性破坏类检查（阻断推送）；其余（拼写/一次性变量/时间标注等）仅记录
          BLOCKING_RE='^\[(TripleOpen|TripleClose|TooManyAngleBrackets|TooManyAngleBrackets2|MissingClosingAngleBracket|MissingClosingAngleBracket2|MissingOpeningAngleBracket2|MissingOpeningBracket|MissingOpeningBracket2|MissingClosingBracket|MissingClosingBracket2|AccidentalAssignmentInIf|AccidentalAssignmentInElseIf|MissingDollar|MissingDollar2|DoubleSlash|ShouldBeElseIf|ElseForAnIf|EqualAndTo|DoubleEqualsInSet|BadCommand|MissingSemicolonBeforeStatement|TypeofNotComparedToString|VarSignMidWord|VarSignAtMacroStart|MissingSpaceInMacro|MissingColonInMacro)\] '

          allhits=""
          blocking=""
          git diff --name-only "$before" "$after" > /tmp/sync-changed.txt
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            # sanityCheck 的发现行以 [检查名] 开头；check.py 的报告行以空格开头
            fhits="$(printf '%s\n' "$out" | grep -E '^(\[| )' | grep -F "$f:" || true)"
            [ -z "$fhits" ] && continue
            allhits="$allhits$fhits"
            blocking="$blocking$(printf '%s\n' "$fhits" | grep -E "$BLOCKING_RE" || true)"
          done < /tmp/sync-changed.txt

          if [ -n "$allhits" ]; then
            echo "== sanityCheck findings in synced files =="
            printf '%s\n' "$allhits"
          fi

          if [ -n "$blocking" ]; then
            echo "::error::sanityCheck 发现本次同步引入的结构性错误，中止推送："
            printf '%s\n' "$blocking"
            exit 1
          fi

          echo "sanityCheck: no structural issues in synced files"
          git push origin master

      - name: Sync dev (仅上游有更新才 push；非快进会被远端拒绝并告警)
        run: |
          if [ "$(git rev-parse -q --verify origin/dev)" != "$(git rev-parse -q --verify upstream/dev)" ]; then
            git push origin upstream/dev:dev
          else
            echo "dev: already up to date"
          fi

      - name: Sync tags (幂等：只推送远端缺失的 tag；同名冲突会被拒绝并告警)
        run: git push origin --tags
